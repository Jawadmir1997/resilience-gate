[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-gate"
version = "0.1.0"
description = "Early-stage prototype for explainable operational resilience and secure software delivery gating."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jawad Yaqoob Mir" }
]
dependencies = [
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
]

[project.scripts]
resilience-gate = "resilience_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
