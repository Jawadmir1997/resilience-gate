name: ResilienceGate CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Run ResilienceGate CLI
        run: |
          python -m resilience_gate.cli \
            --baseline sample_data/metrics_normal.json \
            --current sample_data/metrics_incident.json
        continue-on-error: true
